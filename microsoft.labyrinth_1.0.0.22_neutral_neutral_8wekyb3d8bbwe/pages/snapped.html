<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title></title>
        <script type="ms-deferred/javascript" src="../pages-js/snapped.js"></script>
        <link rel="stylesheet" href="../pages-css/snapped.css" />
    </head>
    <body>
        <div class="page-root snapped-layout" data-fragmentAdded="snappedPage.fragmentAdded" data-fragmentRemovd="snappedPage.fragmentRemoved">
          <div class="snapped-layout-internal"> 
              <div class="snapped-top">
                   <div class="snapped-logo"><img src="/images/snappedlogo.png" /></div>

                   <div class="snapped-best" id="bestCont">Best time <span id="bestTime"></span></div>
                   <div class="snapped-levelname" id="levelName">Level Name</div>
                </div>
            
            
                <canvas id="mainGame" class="snapped-image"></canvas>
                <div id="thankyou" class="snapped-thankyou">Thank You For Playing</div>
                <div class="snapped-bot">
                   <div class="snapped-time" id="currentTime">0:00</div>

                   <div class="snapped-fact"><h2>Did You Know?</h2><div id="mazeFact">Maze fact</div></div>
                </div>
            

            </div>
        </div>
    </body>
</html>
