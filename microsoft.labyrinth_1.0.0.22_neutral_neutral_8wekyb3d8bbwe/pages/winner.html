<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title></title>
        <script type="ms-deferred/javascript" src="../pages-js/winner.js"></script>
        <link rel="stylesheet" href="../pages-css/winner.css" />
    </head>
    <body>
            <div class="page-root winscreen-layout" id="winPage" data-fragmentadded="winPage.fragmentAdded" data-fragmentremoved="winPage.fragmentRemoved">
                            <div class="winscreen-game"><div style="height: 100%"><canvas id="mainGame"></canvas></div></div>
                            <div class="winscreen-info">
                                <div id="yourTime" class="winscreen-yourtime">0:00
                                </div>
                                <div class="winscreen-stars"><img id="WINstars" /></div>
                                <div id="levelName" class="winscreen-levelname">Level Name</div>
                                <div class="winscreen-best" id="WINbest">
                                    <div class="winscreen-bestinner winscreen-bestold">Best time <span id="bestTime">0:00</span></div>
                                    <div class="winscreen-bestinner winscreen-bestnew">Best time <span id="bestTimeNew">0:00</span></div>

                                </div>
                                
                            </div>
                            
                        <div class="wincreen-buttons">
                                <div id="WINnextBtn" class="win-appbar-command winscreen-next nextBtn">  
                                    <div class="win-appbar-icon"></div>
                                </div>
                        </div>
                    </div>


                        
            
    </body>
</html>
